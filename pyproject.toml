[project]
name = "gongeo-us-image-search"
version = "0.1.0"
description = "Offline structured extraction tooling for Infinity Nikki items."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Pillow==12.1.1",
    "requests==2.32.5",
    "python-dotenv==1.2.2",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.uv]
package = false
